<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - White Water Rafting</title>
  <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
  <header>
    <img src="images/logo.jpg" alt="Rafting Logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="company-info">
      <h1>White Water Rafting Company</h1>
      <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com</p>
    </div>

    <div class="contact-grid">
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.757378283!2d32.5825!3d0.3476!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMMKwMjAnNTEuNCJOIDMywrAzNCc1Ny4wIkU!5e0!3m2!1sen!2sug!4v1" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Placeholder">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Placeholder">

        <label>Message Purpose</label>
        <div class="radio-group">
          <label><input type="radio" name="purpose" checked> General Inquiry</label>
          <label><input type="radio" name="purpose"> Reservation Question</label>
          <label><input type="radio" name="purpose"> Website Suggestion</label>
        </div>

        <label for="message">Message</label>
        <textarea id="message" placeholder="Type here..."></textarea>

        <label class="check"><input type="checkbox"> Please Subscribe me to the monthly newsletter</label>

        <button type="submit">Get in Touch!</button>
      </form>
    </div>

    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-profiles">
        <figure>
          <img src="images/happy-imployee.jpg" alt="Employee">
          <figcaption>Employee Profile</figcaption>
        </figure>
        <figure>
          <img src="images/happy-imployee.jpg" alt="Employee">
          <figcaption>Employee Profile</figcaption>
        </figure>
        <figure>
          <img src="images/happy-imployee.jpg" alt="Employee">
          <figcaption>Employee Profile</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>©2026 White Water Rafting | M. Patrick</p>
    <nav class="sociallinks">
      <a href="#"><img src="images/facebook.svg" alt="FB" width="200"></a>
      <a href="#"><img src="images/linkedin.svg" alt="TW" width="200"></a>
      <a href="#"><img src="images/instagram.svg" alt="IG" width="200"></a>
    </nav>
  </footer>
</body>
</html>
